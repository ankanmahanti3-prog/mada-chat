<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mada: Neural Interface</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body { background: #050508; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }

    /* Interactive Canvas Particles */
    #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    /* Auth Screen */
    .auth-container { z-index: 10; width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border-radius: 20px; padding: 32px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .auth-container h2 { text-align: center; margin-bottom: 24px; color: #bb86fc; font-weight: 300; letter-spacing: 2px; }
    .auth-container input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.05); color: #fff; border-radius: 10px; outline: none; transition: 0.3s; }
    .auth-container input:focus { border-color: #bb86fc; box-shadow: 0 0 15px rgba(187, 134, 252, 0.3); }
    .auth-container button { width: 100%; padding: 14px; margin-top: 16px; background: linear-gradient(135deg, #bb86fc 0%, #03dac6 100%); border: none; color: #000; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    .auth-container button:hover { box-shadow: 0 0 20px rgba(3, 218, 198, 0.5); transform: translateY(-2px); }
    .switch-btn { background: transparent; color: #aaa; text-align: center; margin-top: 16px; font-size: 13px; cursor: pointer; text-decoration: underline; }

    /* Workspace */
    #app-workspace { z-index: 5; display: none; width: 95%; max-width: 1200px; height: 90vh; background: rgba(18, 18, 24, 0.4); backdrop-filter: blur(30px); border-radius: 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 20px 60px rgba(0,0,0,0.9); }
    
    /* Sidebar */
    .sidebar { width: 280px; background: rgba(0,0,0,0.3); border-right: 1px solid rgba(255, 255, 255, 0.03); display: flex; flex-direction: column; padding: 20px; }
    .sidebar h3 { color: #bb86fc; margin-bottom: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; }
    .room-list { overflow-y: auto; list-style: none; margin-bottom: 20px; }
    .room-item { padding: 12px 16px; margin-bottom: 6px; border-radius: 12px; cursor: pointer; color: #bbb; transition: all 0.3s ease; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .room-item:hover { color: #fff; background: rgba(255, 255, 255, 0.04); }
    .room-item.active { background: rgba(187, 134, 252, 0.1); color: #fff; font-weight: bold; border: 1px solid rgba(187, 134, 252, 0.2); }
    .status-dot { width: 8px; height: 8px; background: #03dac6; border-radius: 50%; box-shadow: 0 0 8px #03dac6; }
    
    .user-profile { padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.03); display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .logout-btn { background: rgba(207, 102, 121, 0.1); color: #cf6679; padding: 6px 12px; font-size: 12px; border: 1px solid rgba(207, 102, 121, 0.2); border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.15); position: relative; }
    .chat-header { padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.03); display: flex; justify-content: space-between; align-items: center; font-size: 18px; color: #bb86fc; letter-spacing: 1px; }
    
    .audio-toggle-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #03dac6; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }

    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; will-change: scroll-position; }
    
    /* Message Bubbles */
    .msg { padding: 14px 18px; background: rgba(255, 255, 255, 0.03); border-radius: 16px; max-width: 70%; width: fit-content; position: relative; border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .msg.own { background: rgba(187, 134, 252, 0.08); align-self: flex-end; border-color: rgba(187, 134, 252, 0.2); }
    .msg .author { font-size: 12px; color: #bb86fc; font-weight: 500; margin-bottom: 6px; }
    .msg.own .author { color: #03dac6; }
    .msg img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
    .msg .time { font-size: 10px; color: #777; text-align: right; margin-top: 6px; }
    
    /* Custom Waveform Bar */
    .waveform-container { display: flex; align-items: center; gap: 4px; height: 30px; margin-top: 8px; cursor: pointer; }
    .waveform-bar { width: 4px; height: 100%; background: #03dac6; border-radius: 2px; animation: wavePulse 1s ease-in-out infinite alternate; }
    @keyframes wavePulse { 0% { height: 20%; } 100% { height: 100%; } }

    .msg-actions { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity 0.2s; display: flex; gap: 8px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 8px; }
    .msg:hover .msg-actions { opacity: 1; }
    .action-btn { cursor: pointer; font-size: 14px; opacity: 0.7; }
    .action-btn:hover { opacity: 1; transform: scale(1.2); }

    .typing-indicator { height: 24px; font-size: 13px; color: #03dac6; padding: 0 24px; font-style: italic; }

    /* Controls Bar */
    .chat-input-container { padding: 16px 24px; background: rgba(0,0,0,0.25); border-top: 1px solid rgba(255, 255, 255, 0.03); display: flex; gap: 10px; align-items: center; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; }
    .chat-input-container input[type="text"] { flex: 1; padding: 16px; background: transparent; border: none; color: #fff; outline: none; font-size: 15px; }
    .icon-btn { background: transparent; border: none; color: #888; padding: 10px; cursor: pointer; font-size: 18px; }
    .icon-btn:hover { color: #fff; }
    .icon-btn.recording { color: #cf6679; animation: recPulse 1s infinite; }
    @keyframes recPulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .send-btn { background: rgba(3, 218, 198, 0.15); border: 1px solid rgba(3, 218, 198, 0.4); color: #03dac6; padding: 14px 24px; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 13px; letter-spacing: 1px; }

    /* Command Palette Overlay */
    #cmd-palette { display: none; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(10, 10, 15, 0.95); border: 1px solid rgba(187, 134, 252, 0.4); border-radius: 16px; padding: 16px; box-shadow: 0 0 30px rgba(187, 134, 252, 0.2); z-index: 100; backdrop-filter: blur(20px); }
    #cmd-input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; outline: none; font-size: 16px; }
    .cmd-hint { font-size: 11px; color: #888; margin-top: 8px; }

    /* Emoji Picker */
    .emoji-picker { display: none; position: absolute; bottom: 85px; right: 110px; background: rgba(0, 0, 0, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px; grid-template-columns: repeat(5, 1fr); gap: 8px; z-index: 100; }
    .emoji-picker span { font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="auth-container" id="auth-screen">
  <h2 id="auth-title">neural::access</h2>
  <input type="text" id="username" placeholder="neural_tag" autocomplete="off">
  <input type="password" id="password" placeholder="neural_key">
  <button id="auth-btn" onclick="handleAuth()">Authenticate</button>
  <div class="switch-btn" onclick="toggleAuthMode()" id="switch-text">New interface detected? Register</div>
</div>

<div id="app-workspace">
  <div class="sidebar">
    <h3>rooms</h3>
    <ul class="room-list">
      <li class="room-item active" onclick="switchRoom('General', this)"># general</li>
      <li class="room-item" onclick="switchRoom('Random', this)"># random</li>
      <li class="room-item" onclick="switchRoom('Tech', this)"># tech</li>
    </ul>

    <h3>active_neural_links</h3>
    <ul class="room-list" id="online-users-list"></ul>

    <div class="user-profile">
      <span id="current-user-display"></span>
      <button class="logout-btn" onclick="logout()">Terminate</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <span id="room-header">:: neural_link_active // #general</span>
      <button class="audio-toggle-btn" onclick="toggleSound()" id="sound-btn">🔊 Audio: ON</button>
    </div>
    
    <div id="messages"></div>
    <div class="typing-indicator" id="typing-indicator"></div>
    
    <form class="chat-input-container" onsubmit="sendMessage(event)">
      <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(event)">
      
      <div class="input-wrapper">
        <button type="button" class="icon-btn" onclick="document.getElementById('file-input').click()">+</button>
        <input type="text" id="msg-input" placeholder="Transmit thought... (Ctrl+K for Commands)" autocomplete="off" oninput="handleTypingThrottled()">
        <button type="button" class="icon-btn" onclick="toggleEmojiPicker()">😀</button>
        <button type="button" class="icon-btn" id="mic-btn" onclick="toggleRecordAudio()">🎙️</button>
      </div>
      
      <button type="submit" class="send-btn">Transmit</button>

      <div class="emoji-picker" id="emoji-picker">
        <span onclick="addEmoji('😊')">😊</span>
        <span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('🔥')">🔥</span>
        <span onclick="addEmoji('👍')">👍</span>
        <span onclick="addEmoji('❤️')">❤️</span>
      </div>
    </form>
  </div>
</div>

<!-- Command Palette -->
<div id="cmd-palette">
  <input type="text" id="cmd-input" placeholder="Type command: /room tech, /clear, /dm username..." onkeydown="handleCommand(event)">
  <div class="cmd-hint">Commands: <b>/room [name]</b> | <b>/clear</b> | <b>/dm [user]</b> (Esc to close)</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  let isLogin = true;
  let currentUser = localStorage.getItem('mada_user') || null;
  let currentRoom = 'General';
  let selectedFileUrl = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let typingTimeout = null;
  let soundEnabled = true;
  let isTypingEmitted = false;
  const MAX_DOM_MESSAGES = 100;

  const socket = io();

  /* Synthesized Spatial Audio FX */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type = 'sine') {
    if (!soundEnabled) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-btn').innerText = soundEnabled ? '🔊 Audio: ON' : '🔇 Audio: OFF';
  }

  if (currentUser) {
    showWorkspace();
  }

  function toggleAuthMode() {
    isLogin = !isLogin;
    document.getElementById('auth-title').innerText = isLogin ? 'neural::access' : 'neural::provision';
    document.getElementById('auth-btn').innerText = isLogin ? 'Authenticate' : 'Provision';
  }

  async function handleAuth() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) return alert('Input required.');

    const endpoint = isLogin ? '/api/login' : '/api/register';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    if (res.ok) {
      if (isLogin) {
        currentUser = data.username;
        localStorage.setItem('mada_user', currentUser);
        showWorkspace();
      } else {
        alert('Provisioned! Switch to Authenticate.');
        toggleAuthMode();
      }
    } else {
      alert(data.error || 'Access denied.');
    }
  }

  function showWorkspace() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-workspace').style.display = 'flex';
    document.getElementById('current-user-display').innerText = `tag: ${currentUser}`;
    socket.emit('user connected', currentUser);
    socket.emit('join room', currentRoom);
  }

  function logout() {
    localStorage.removeItem('mada_user');
    currentUser = null;
    location.reload();
  }

  function switchRoom(room, el) {
    currentRoom = room;
    playSound(600);
    const isDM = room.startsWith('dm_');
    document.getElementById('room-header').innerText = isDM ? '💬 neural_dm: ' + getDMRecipientName(room) : ':: neural_link // #' + room;
    document.querySelectorAll('.room-item').forEach(item => item.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById('messages').innerHTML = '';
    socket.emit('join room', currentRoom);
  }

  function openDM(targetUser) {
    if (targetUser === currentUser) return;
    const dmRoom = ['dm', [currentUser, targetUser].sort().join('_')].join('_');
    switchRoom(dmRoom, null);
  }

  function getDMRecipientName(dmRoom) {
    return dmRoom.replace('dm_', '').split('_').filter(u => u !== currentUser)[0] || 'User';
  }

  socket.on('online users update', (users) => {
    const list = document.getElementById('online-users-list');
    list.innerHTML = '';
    users.forEach(user => {
      const li = document.createElement('li');
      li.className = 'room-item';
      li.innerHTML = `<span class="status-dot"></span> ${user} ${user === currentUser ? '(You)' : ''}`;
      if (user !== currentUser) li.onclick = () => openDM(user);
      list.appendChild(li);
    });
  });

  socket.on('chat history', (history) => {
    const list = document.getElementById('messages');
    list.innerHTML = '';
    history.forEach(appendMessage);
    scrollToBottom();
  });

  socket.on('chat message', (msg) => {
    if (msg.room === currentRoom) {
      appendMessage(msg);
      playSound(msg.username === currentUser ? 800 : 400);
      scrollToBottom();
    }
  });

  /* Optimized Throttled Typing Signal */
  function handleTypingThrottled() {
    if (!isTypingEmitted) {
      socket.emit('typing', { username: currentUser, room: currentRoom });
      isTypingEmitted = true;
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      socket.emit('stop typing', { username: currentUser, room: currentRoom });
      isTypingEmitted = false;
    }, 1500);
  }

  socket.on('user typing', (data) => {
    if (data.room === currentRoom) document.getElementById('typing-indicator').innerText = `${data.username} transmitting...`;
  });

  socket.on('user stop typing', (data) => {
    if (data.room === currentRoom) document.getElementById('typing-indicator').innerText = '';
  });

  socket.on('message edited', (data) => {
    const msgEl = document.querySelector(`[data-id="${data.id}"] .msg-text`);
    if (msgEl) msgEl.innerText = data.newMessage + ' (updated)';
  });

  socket.on('message deleted', (data) => {
    const msgEl = document.querySelector(`[data-id="${data.id}"]`);
    if (msgEl) msgEl.remove();
  });

  function appendMessage(msg) {
    const list = document.getElementById('messages');
    
    // Performance: DOM Cap to max 100 elements to preserve 60FPS scrolling
    if (list.children.length >= MAX_DOM_MESSAGES) {
      list.removeChild(list.firstChild);
    }

    const div = document.createElement('div');
    const isOwn = msg.username === currentUser;
    div.className = `msg ${isOwn ? 'own' : ''}`;
    div.setAttribute('data-id', msg.id);

    const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    let contentHtml = `<div class="author">${msg.username}</div><div class="msg-text">${msg.message || ''}</div>`;
    
    if (msg.fileUrl) {
      if (msg.fileUrl.startsWith('data:audio/')) {
        contentHtml += `
          <div class="waveform-container" onclick="playWaveformAudio('${msg.fileUrl}')">
            <div class="waveform-bar" style="animation-delay: 0.1s"></div>
            <div class="waveform-bar" style="animation-delay: 0.3s"></div>
            <div class="waveform-bar" style="animation-delay: 0.2s"></div>
            <div class="waveform-bar" style="animation-delay: 0.5s"></div>
            <div class="waveform-bar" style="animation-delay: 0.4s"></div>
            <span style="font-size:11px; margin-left:8px; color:#03dac6;">▶ Play Audio Stream</span>
          </div>`;
      } else if (msg.fileUrl.startsWith('data:image/')) {
        contentHtml += `<img src="${msg.fileUrl}" loading="lazy">`;
      } else {
        contentHtml += `<a href="${msg.fileUrl}" download="file" style="color:#03dac6; display:block; margin-top:8px;">📎 Link Data Attachment</a>`;
      }
    }

    if (isOwn) {
      contentHtml += `<div class="msg-actions"><span class="action-btn" onclick="editMsg(${msg.id}, \`${msg.message || ''}\`)">✏️</span><span class="action-btn" onclick="deleteMsg(${msg.id})">🗑️</span></div>`;
    }

    contentHtml += `<div class="time">${timeStr}</div>`;
    div.innerHTML = contentHtml;
    list.appendChild(div);
  }

  function playWaveformAudio(src) {
    const a = new Audio(src);
    a.play();
  }

  function sendMessage(e) {
    if (e) e.preventDefault();
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if ((text || selectedFileUrl) && currentUser) {
      socket.emit('chat message', { room: currentRoom, username: currentUser, message: text, fileUrl: selectedFileUrl });
      socket.emit('stop typing', { username: currentUser, room: currentRoom });
      isTypingEmitted = false;
      input.value = '';
      selectedFileUrl = null;
    }
  }

  function editMsg(id, oldText) {
    const newText = prompt('Neural update:', oldText);
    if (newText && newText !== oldText) socket.emit('edit message', { id, room: currentRoom, username: currentUser, newMessage: newText });
  }

  function deleteMsg(id) {
    if (confirm('Terminate thought stream?')) socket.emit('delete message', { id, room: currentRoom, username: currentUser });
  }

  function handleFileUpload(e) {
    const file = e.target.files[0];
    if (file) {
      if (file.size > 4 * 1024 * 1024) {
        return alert('File size exceeds 4MB limit.');
      }
      const reader = new FileReader();
      reader.onload = function(evt) { selectedFileUrl = evt.target.result; sendMessage(); };
      reader.readAsDataURL(file);
    }
  }

  async function toggleRecordAudio() {
    const micBtn = document.getElementById('mic-btn');
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => { selectedFileUrl = reader.result; sendMessage(); };
          reader.readAsDataURL(audioBlob);
          stream.getTracks().forEach(track => track.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
      } catch (err) { alert('Microphone stream error.'); }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
    }
  }

  function toggleEmojiPicker() {
    const picker = document.getElementById('emoji-picker');
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
  }

  function addEmoji(emoji) {
    document.getElementById('msg-input').value += emoji;
    document.getElementById('emoji-picker').style.display = 'none';
  }

  function scrollToBottom() {
    const list = document.getElementById('messages');
    list.scrollTop = list.scrollHeight;
  }

  /* Command Palette (Ctrl + K) */
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const palette = document.getElementById('cmd-palette');
      palette.style.display = palette.style.display === 'block' ? 'none' : 'block';
      if (palette.style.display === 'block') document.getElementById('cmd-input').focus();
    } else if (e.key === 'Escape') {
      document.getElementById('cmd-palette').style.display = 'none';
    }
  });

  function handleCommand(e) {
    if (e.key === 'Enter') {
      const val = e.target.value.trim();
      if (val === '/clear') {
        document.getElementById('messages').innerHTML = '';
      } else if (val.startsWith('/room ')) {
        switchRoom(val.replace('/room ', '').trim(), null);
      } else if (val.startsWith('/dm ')) {
        openDM(val.replace('/dm ', '').trim());
      }
      e.target.value = '';
      document.getElementById('cmd-palette').style.display = 'none';
    }
  }

  /* Lightweight Particle System */
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < 35; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      radius: Math.random() * 1.8
    });
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(187, 134, 252, 0.25)';
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
</script>

</body>
</html>

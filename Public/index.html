<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neural Link</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0f">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0c10;
      color: #e2e8f0;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    
    /* Backdrop Drawer Overlay */
    .drawer-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden select-none bg-[#0a0a0f]">

  <!-- Top App Bar -->
  <header class="h-14 bg-[#12131a] border-b border-white/5 px-4 flex items-center justify-between z-20 flex-shrink-0">
    <button id="open-channels-btn" class="p-2 text-slate-400 hover:text-white rounded-lg focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    
    <div class="flex items-center space-x-2">
      <span class="font-semibold text-sm text-slate-200" id="header-room-title"># General</span>
    </div>

    <button id="open-profile-btn" class="p-2 text-slate-400 hover:text-white rounded-lg focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
    </button>
  </header>

  <!-- Sub-header Notice -->
  <div class="bg-[#18122B]/80 border-b border-purple-500/20 px-3 py-1.5 text-[11px] text-purple-300 flex items-center justify-center space-x-1.5 flex-shrink-0">
    <span>📌</span>
    <span><strong>Notice:</strong> Neural Link v2.0 deployed. High-speed quantum AI active.</span>
  </div>

  <!-- Messages Chat Feed -->
  <main id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar flex flex-col">
    <!-- Centered Empty State -->
    <div id="empty-state" class="m-auto text-center text-slate-500 py-12 flex flex-col items-center">
      <div class="flex items-center space-x-2 text-xs text-slate-400 font-medium mb-1">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span>Neural Link Active</span>
      </div>
      <p class="text-xs text-slate-600">Waiting for the first transmission...</p>
    </div>
  </main>

  <!-- Typing Indicator -->
  <div id="typing-indicator" class="px-4 py-0.5 text-[11px] text-slate-500 italic h-4 flex-shrink-0"></div>

  <!-- Bottom Capsule Input Bar -->
  <footer class="p-3 bg-[#0a0a0f] flex-shrink-0">
    <form id="chat-form" class="flex items-center bg-[#13141d] rounded-full border border-white/10 px-3 py-1.5 space-x-2 shadow-lg focus-within:border-purple-500/50 transition">
      
      <!-- Attachment Button -->
      <button type="button" class="text-slate-400 hover:text-white p-1 text-sm font-semibold">
        +
      </button>

      <!-- Input Field -->
      <input 
        type="text" 
        id="message-input" 
        placeholder="Transmit thoughts..." 
        autocomplete="off" 
        class="flex-1 bg-transparent text-sm text-slate-200 placeholder-slate-500 focus:outline-none"
      >

      <!-- Action Buttons -->
      <div class="flex items-center space-x-1.5 text-slate-400">
        <button type="button" id="stt-btn" class="p-1 hover:text-cyan-400 text-xs transition" title="Speech to Text">🎤</button>
        <button type="button" id="voice-rec-btn" class="p-1 hover:text-cyan-400 text-xs transition" title="Voice Note">🎙️</button>
        <button type="button" id="emoji-btn" class="p-1 hover:text-yellow-400 text-xs transition">😊</button>
      </div>

      <!-- Transmit Button -->
      <button 
        type="submit" 
        class="bg-[#8b5cf6] hover:bg-[#7c3aed] text-white w-8 h-8 rounded-full flex items-center justify-center transition shadow-md flex-shrink-0"
      >
        <svg class="w-3.5 h-3.5 fill-current transform rotate-90 translate-x-[1px]" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
      </button>
    </form>
  </footer>

  <!-- Left Drawer: Channels Navigation -->
  <div id="channels-drawer-backdrop" class="fixed inset-0 drawer-overlay z-40 hidden"></div>
  <aside id="channels-drawer" class="fixed inset-y-0 left-0 w-72 bg-[#12131a] border-r border-white/10 z-50 transform -translate-x-full transition-transform duration-200 ease-in-out flex flex-col">
    <div class="p-4 border-b border-white/10 flex justify-between items-center">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Channels</span>
      <button id="close-channels-btn" class="text-slate-400 hover:text-white text-sm">✕</button>
    </div>
    <div class="p-3 space-y-1 overflow-y-auto flex-1">
      <button data-room="General" class="channel-btn w-full text-left px-3 py-2 rounded-lg bg-purple-500/10 text-purple-300 font-medium text-sm"># General</button>
      <button data-room="Cyber Lounge" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-white/5 hover:text-slate-200 text-sm"># Cyber Lounge</button>
      <button data-room="Dev Protocol" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-white/5 hover:text-slate-200 text-sm"># Dev Protocol</button>
      <button data-room="AI Assistant" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-cyan-400 hover:bg-cyan-500/10 text-sm">⚡ # AI Assistant</button>
    </div>
  </aside>

  <!-- Right Drawer: User Profile & Online List -->
  <div id="profile-drawer-backdrop" class="fixed inset-0 drawer-overlay z-40 hidden"></div>
  <aside id="profile-drawer" class="fixed inset-y-0 right-0 w-72 bg-[#12131a] border-l border-white/10 z-50 transform translate-x-full transition-transform duration-200 ease-in-out flex flex-col">
    <div class="p-4 border-b border-white/10 flex justify-between items-center">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Node Status</span>
      <button id="close-profile-btn" class="text-slate-400 hover:text-white text-sm">✕</button>
    </div>
    <div class="p-4 space-y-4">
      <div class="text-center py-2">
        <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-600 mx-auto flex items-center justify-center font-bold text-lg text-white mb-2 shadow-lg" id="user-avatar">?</div>
        <h3 id="profile-username" class="font-medium text-slate-200 text-sm">Guest Operator</h3>
        <p class="text-[11px] text-emerald-400 mt-0.5">● Connected</p>
      </div>
      <div class="border-t border-white/10 pt-3">
        <h4 class="text-[11px] uppercase tracking-wider text-slate-400 mb-2">Connected Nodes</h4>
        <ul id="online-users-list" class="space-y-2 text-xs text-slate-300"></ul>
      </div>
    </div>
  </aside>

  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Main JavaScript File -->
  <script src="/script.js"></script>
</body>
</html>

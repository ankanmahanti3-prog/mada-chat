<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURAL LINK v2.0</title>

  <!-- PWA Integration -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00f2fe">

  <!-- Tailwind CSS & Socket.io -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-glow: #00f2fe;
    }
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #0a0a12;
      color: #e2e8f0;
    }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    .glass-input {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      border-color: var(--accent-glow);
      box-shadow: 0 0 12px var(--accent-glow);
      outline: none;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between relative overflow-hidden select-none">

  <!-- Header Section -->
  <header class="glass-panel z-20 px-4 py-3 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <button id="open-channels" class="md:hidden p-2 text-slate-400 hover:text-white">☰</button>
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="font-cyber font-bold text-lg md:text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
          NEURAL LINK <span class="text-xs text-slate-400 font-normal">v2.0</span>
        </h1>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <span id="online-badge" class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        🟢 <span id="online-count" class="ml-1">1 linked</span>
      </span>

      <select id="theme-selector" class="glass-input text-xs px-2 py-1 rounded bg-slate-900 text-slate-300">
        <option value="cyan">Cyan Pulse</option>
        <option value="purple">Neon Purple</option>
        <option value="green">Matrix Green</option>
        <option value="orange">Solar Orange</option>
        <option value="red">Cyber Red</option>
      </select>

      <button id="open-profile" class="md:hidden p-2 text-slate-400 hover:text-white">👤</button>
    </div>
  </header>

  <!-- Content Layout -->
  <div class="flex-1 flex overflow-hidden z-10 relative">

    <!-- Channels Sidebar -->
    <aside id="channel-drawer" class="w-64 glass-panel hidden md:flex flex-col border-r border-slate-800">
      <div class="p-4 border-b border-slate-800">
        <h2 class="font-cyber text-sm tracking-wider text-slate-400">FREQUENCY CHANNELS</h2>
      </div>
      <div class="p-2 space-y-1 custom-scrollbar overflow-y-auto flex-1" id="channel-list">
        <button data-room="General Matrix" class="room-btn w-full text-left px-3 py-2 rounded-lg bg-cyan-500/10 text-cyan-400 font-medium border border-cyan-500/20">
          # General Matrix
        </button>
        <button data-room="Cyber Lounge" class="room-btn w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
          # Cyber Lounge
        </button>
        <button data-room="Dev Protocol" class="room-btn w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
          # Dev Protocol
        </button>
        <button data-room="AI Assistant" class="room-btn w-full text-left px-3 py-2 rounded-lg text-purple-400 hover:bg-purple-900/20">
          ⚡ # AI Assistant
        </button>
      </div>
    </aside>

    <!-- Chat Console -->
    <main class="flex-1 flex flex-col justify-between glass-panel m-0 md:m-3 rounded-none md:rounded-xl overflow-hidden border-0 md:border border-slate-800">
      
      <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/40 flex justify-between items-center">
        <span id="current-room-title" class="font-cyber text-sm text-cyan-400"># General Matrix</span>
        <span class="text-xs text-slate-500">Press Ctrl+K for commands</span>
      </div>

      <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar"></div>

      <div id="typing-indicator" class="px-4 py-1 text-xs text-slate-500 italic h-5"></div>

      <div class="p-3 border-t border-slate-800 bg-slate-900/60">
        <form id="chat-form" class="flex items-center space-x-2">
          <button type="button" id="voice-rec-btn" class="p-2 rounded-lg glass-input text-slate-400 hover:text-cyan-400">🎙️</button>
          <button type="button" id="stt-btn" class="p-2 rounded-lg glass-input text-slate-400 hover:text-cyan-400">🎤</button>
          <input type="text" id="message-input" placeholder="Transmit neural message or type @AI..." autocomplete="off" class="flex-1 glass-input px-4 py-2.5 rounded-lg text-sm text-white placeholder-slate-500">
          <button type="submit" class="px-4 py-2.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-cyber text-xs tracking-wider hover:opacity-90 transition shadow-lg shadow-cyan-500/20">
            TRANSMIT ➤
          </button>
        </form>
      </div>
    </main>

    <!-- User Profile Sidebar -->
    <aside id="profile-drawer" class="w-64 glass-panel hidden md:flex flex-col border-l border-slate-800">
      <div class="p-4 border-b border-slate-800">
        <h2 class="font-cyber text-sm tracking-wider text-slate-400">USER PROFILE</h2>
      </div>
      <div class="p-4 space-y-4">
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 mx-auto flex items-center justify-center font-cyber font-bold text-xl text-white shadow-lg shadow-cyan-500/20 mb-2" id="user-avatar">?</div>
          <h3 id="profile-username" class="font-cyber text-base text-white">Guest Operator</h3>
          <p class="text-xs text-emerald-400">Online & Encrypted</p>
        </div>
        <div class="border-t border-slate-800 pt-4">
          <h4 class="text-xs font-cyber text-slate-400 mb-2">ACTIVE NODES</h4>
          <ul id="online-users-list" class="space-y-1.5 text-xs text-slate-300"></ul>
        </div>
      </div>
    </aside>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('⚡ PWA Service Worker Registered!'))
          .catch(err => console.log('PWA Service Worker Error:', err));
      });
    }
  </script>
  <script src="/script.js"></script>
</body>
</html>
